---
# local-libvirt는 github-runner 컨테이너가 tofu apply까지 대신 실행한다 (local-mac과 달리
# libvirt는 원격 클라이언트-서버 프로토콜을 지원해 게스트 VM 안에서도 하이퍼바이저 호스트의
# libvirtd에 접속 가능하기 때문). terraform-provider-libvirt가 링크하는 libvirt 클라이언트
# 라이브러리를 러너 컨테이너에 추가로 설치해야 한다.
github_runner_extra_packages: "libvirt-clients"

# deploy.yml/plan.yml의 runs-on: ["self-hosted", "local"] 과 라벨을 맞춘다.
github_runner_labels: "self-hosted,local"

# role 기본값(arm64)은 Apple Silicon Mac 기준. local-libvirt는 보통 x86_64 서버.
github_runner_arch: x64
