---
# hosts.ini가 IP를 inventory_hostname으로 쓰기 때문에, github-runner role의 기본값을 그대로
# 두면 러너 이름이 IP로 등록돼 알아보기 어렵다. (러너를 설치할 때만 쓰이는 값)
github_runner_name: proxmox
github_runner_labels: "self-hosted,proxmox"

# Proxmox 홈서버는 x86_64. (이 파일 변경은 deploy.yml 트리거 경로(ansible/**)에 해당한다)
github_runner_arch: x64

# 앱 이미지 빌드 워크플로(build-images.yml)가 이 러너에서 nerdctl/buildkit으로 빌드·push하려면 필요.
# 바꾼 뒤에는 `--tags github-runner`로 러너를 다시 적용해야 마운트가 반영된다.
github_runner_build_tools_enabled: true
