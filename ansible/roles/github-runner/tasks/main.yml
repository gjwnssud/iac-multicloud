---
# 사설망(lima/libvirt)처럼 GitHub 호스팅 러너가 도달할 수 없는 클러스터에서
# ansible-playbook을 실행하거나(기본) 앱 이미지를 빌드/배포하기 위한(build_tools_enabled)
# self-hosted runner를 컨테이너로 띄운다. tofu apply(예: lima의 limactl VM 생성/삭제)는
# 이 러너로 대체할 수 없다 - limactl은 macOS 호스트 전용이며 게스트 VM 안에서는 자기 자신을
# 관리할 수 없으므로 여전히 Mac에서 직접 실행해야 한다.
#
# 레포 하나당 러너 하나가 원칙이다 - github_runner_repo/instance만 바꿔 이 롤을 여러 번
# include하면 같은 호스트에 레포별로 독립된 러너를 여러 개 띄울 수 있다 (예: 인프라 변경
# 감지용 iac-multicloud 러너 + 앱 이미지 빌드용 ott-services 러너를 같은 서버 노드에 공존).
#
# 기본적으로 실행되지 않고 site.yml에서 `--tags github-runner`로 명시할 때만 적용된다.

- name: 필수 변수 확인
  ansible.builtin.assert:
    that:
      - github_runner_repo | length > 0
      - github_runner_pat | length > 0
    fail_msg: "github_runner_repo/github_runner_pat 를 -e 또는 ansible-vault로 지정해야 한다"

- name: (마이그레이션) 인스턴스 구분 이전의 고정 이름 러너 정리
  # instance 개념 도입 전에는 컨테이너/유닛/데이터 디렉터리가 전부 "github-runner"
  # 고정이었다. 정리 없이 새 이름으로 넘어가면 옛 유닛이 안 지워진 채 같이 남아 러너가
  # 두 번 등록된다. 매번 시도하되 대상이 없으면(새 호스트) 조용히 넘어간다.
  block:
    - name: 레거시 systemd 유닛 중지/비활성화
      ansible.builtin.systemd:
        name: github-runner
        state: stopped
        enabled: false
      failed_when: false

    - name: 레거시 유닛 파일 제거
      ansible.builtin.file:
        path: /etc/systemd/system/github-runner.service
        state: absent

    - name: 레거시 컨테이너 제거
      ansible.builtin.command: >
        /usr/local/bin/nerdctl --namespace k8s.io --address /run/k3s/containerd/containerd.sock
        rm -f github-runner
      failed_when: false
      changed_when: false

- name: 러너 데이터 디렉터리 생성 (등록 정보 및 워크스페이스 영속화)
  ansible.builtin.file:
    path: "{{ github_runner_data_dir }}"
    state: directory
    mode: "0700"

- name: 러너 엔트리포인트 스크립트 배치 (PAT 포함 - 로그 노출 방지)
  ansible.builtin.template:
    src: entrypoint.sh.j2
    dest: "{{ github_runner_data_dir }}/entrypoint.sh"
    mode: "0700"
  register: github_runner_entrypoint
  no_log: true

- name: GitHub Actions 러너 systemd 유닛 배치
  ansible.builtin.template:
    src: github-runner.service.j2
    dest: "/etc/systemd/system/github-runner-{{ github_runner_instance }}.service"
    mode: "0644"
  register: github_runner_unit

- name: GitHub Actions 러너 기동
  ansible.builtin.systemd:
    name: "github-runner-{{ github_runner_instance }}"
    daemon_reload: "{{ github_runner_unit.changed }}"
    enabled: true
    state: "{{ 'restarted' if (github_runner_unit.changed or github_runner_entrypoint.changed) else 'started' }}"
