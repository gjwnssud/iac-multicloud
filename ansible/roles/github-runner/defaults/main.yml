github_runner_repo: "" # 예: gjwnssud/iac-multicloud (필수)
github_runner_pat: "" # repo scope PAT. 절대 커밋 금지 - ansible-vault로 암호화해 -e로 전달
github_runner_labels: "self-hosted,{{ inventory_hostname }}"
github_runner_name: "{{ inventory_hostname }}"
github_runner_arch: arm64 # Apple Silicon Mac(Lima) 기본값. Intel/리눅스 호스트는 x64로 override
github_runner_version: "2.319.1"
github_runner_data_dir: /var/lib/github-runner
github_runner_image: "ubuntu:24.04"
github_runner_extra_packages: "" # 예: local-libvirt는 "libvirt-clients" (원격 qemu+ssh용 클라이언트 라이브러리)
