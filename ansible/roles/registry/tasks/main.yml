---
# registry_role == host: 레지스트리 컨테이너를 직접 구동하는 노드 (보통 k3s 서버 1대).
# registry_role == client: registries.yaml만 배치해 host의 레지스트리를 그대로 참조하는 노드.
# 두 역할 모두 k3s/k3s-agent가 TLS 없는 레지스트리를 신뢰하도록 registries.yaml이 필요하다.

- name: UFW 허용 - 로컬 레지스트리 ({{ registry_port }}/tcp, 호스트 자신에게 오는 트래픽)
  community.general.ufw:
    rule: allow
    port: "{{ registry_port }}"
    proto: tcp
  when: registry_role == 'host'

- name: UFW 허용 - 로컬 레지스트리 포트로의 포워딩 (nerdctl 포트퍼블리시는 컨테이너 네트워크 네임스페이스로
    NAT/포워딩되므로 route 규칙이 별도로 필요. ufw 기본 정책이 routed 트래픽을 차단하기 때문에
    라우팅 규칙 없이는 다른 노드에서 접근 시 타임아웃난다)
  community.general.ufw:
    rule: allow
    route: true
    port: "{{ registry_port }}"
    proto: tcp
  when: registry_role == 'host'

- name: 레지스트리 데이터 디렉터리 생성
  ansible.builtin.file:
    path: "{{ registry_data_dir }}"
    state: directory
    mode: "0755"
  when: registry_role == 'host'

- name: 로컬 레지스트리 systemd 유닛 배치 (nerdctl, k3s containerd 소켓)
  ansible.builtin.copy:
    dest: /etc/systemd/system/local-registry.service
    mode: "0644"
    content: |
      [Unit]
      Description=Local OCI registry (nerdctl, k3s containerd)
      After=k3s.service
      Requires=k3s.service

      [Service]
      ExecStartPre=-/usr/local/bin/nerdctl --namespace k8s.io --address /run/k3s/containerd/containerd.sock rm -f local-registry
      ExecStart=/usr/local/bin/nerdctl --namespace k8s.io --address /run/k3s/containerd/containerd.sock \
        run --name local-registry -p {{ registry_port }}:5000 \
        -v {{ registry_data_dir }}:/var/lib/registry \
        registry:{{ registry_version }}
      ExecStop=-/usr/local/bin/nerdctl --namespace k8s.io --address /run/k3s/containerd/containerd.sock stop local-registry
      Restart=always

      [Install]
      WantedBy=multi-user.target
  register: local_registry_unit
  when: registry_role == 'host'

- name: 로컬 레지스트리 기동
  ansible.builtin.systemd:
    name: local-registry
    daemon_reload: "{{ local_registry_unit.changed }}"
    enabled: true
    state: started
  when: registry_role == 'host'

- name: /etc/rancher/k3s 디렉터리 생성 (에이전트는 k3s 설치 시 자동 생성되지 않음)
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: k3s registries.yaml 배치 (TLS 없는 로컬 레지스트리를 평문 HTTP로 허용)
  # configs만 넣으면 k3s가 생성하는 hosts.toml의 기본 server가 여전히
  # "https://{{ registry_host }}:{{ registry_port }}/v2"로 고정된다.
  # insecure_skip_verify는 "인증서 검증을 생략"할 뿐 "평문 HTTP로 말하라"는
  # 뜻이 아니어서, TLS 자체가 없는 레지스트리에는 계속 https로 접속을 시도하다
  # "server gave HTTP response to HTTPS client" 에러로 실패한다 (k3s/k3s-agent가
  # 재시작될 때마다 hosts.toml이 이 registries.yaml로부터 다시 생성되므로 매번
  # 재발한다 — 한 번 우연히 이미지가 로컬에 캐시돼 있어 재현되지 않을 수도 있다).
  # mirrors로 실제 http:// 엔드포인트를 명시해야 hosts.toml에 그 항목이 추가되고
  # containerd가 그걸 통해 정상적으로 pull한다.
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0644"
    content: |
      mirrors:
        "{{ registry_host }}:{{ registry_port }}":
          endpoint:
            - "http://{{ registry_host }}:{{ registry_port }}"
      configs:
        "{{ registry_host }}:{{ registry_port }}":
          tls:
            insecure_skip_verify: true
  register: k3s_registries_config

- name: registries.yaml 변경 반영 위해 k3s 재시작 (서버)
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: registry_role == 'host' and k3s_registries_config.changed

- name: registries.yaml 변경 반영 위해 k3s-agent 재시작 (에이전트)
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when: registry_role == 'client' and k3s_registries_config.changed
