---
- name: UFW 허용 - k3s API (6443/tcp)
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp

- name: UFW 허용 - kubelet (10250/tcp)
  community.general.ufw:
    rule: allow
    port: "10250"
    proto: tcp

- name: UFW 허용 - flannel VXLAN (8472/udp)
  community.general.ufw:
    rule: allow
    port: "8472"
    proto: udp

- name: k3s 설치 스크립트 다운로드
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: k3s 서버 설치
  ansible.builtin.command: /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_EXEC: "server {{ k3s_extra_exec_args }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_role == 'server'

- name: k3s 에이전트 설치
  ansible.builtin.command: /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_EXEC: agent
    INSTALL_K3S_URL: "{{ k3s_server_url }}"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_role == 'agent'

- name: nerdctl 아키텍처 매핑
  ansible.builtin.set_fact:
    nerdctl_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: nerdctl-full 다운로드 (nerdctl + buildkit 바이너리 포함)
  ansible.builtin.get_url:
    url: "https://github.com/containerd/nerdctl/releases/download/v{{ nerdctl_version }}/nerdctl-full-{{ nerdctl_version }}-linux-{{ nerdctl_arch }}.tar.gz"
    dest: "/tmp/nerdctl-full-{{ nerdctl_version }}-linux-{{ nerdctl_arch }}.tar.gz"
    mode: "0644"

- name: nerdctl-full 압축 해제 (/usr/local)
  ansible.builtin.unarchive:
    src: "/tmp/nerdctl-full-{{ nerdctl_version }}-linux-{{ nerdctl_arch }}.tar.gz"
    dest: /usr/local
    remote_src: true
    creates: /usr/local/bin/nerdctl

- name: buildkitd systemd 유닛 배치 (k3s containerd 소켓의 k8s.io 네임스페이스로 연결)
  ansible.builtin.copy:
    dest: /etc/systemd/system/buildkit.service
    mode: "0644"
    content: |
      [Unit]
      Description=BuildKit for nerdctl build (k3s containerd worker)
      After=k3s.service
      Requires=k3s.service

      [Service]
      ExecStart=/usr/local/bin/buildkitd \
        --addr unix:///run/buildkit/buildkitd.sock \
        --oci-worker=false \
        --containerd-worker=true \
        --containerd-worker-addr=/run/k3s/containerd/containerd.sock \
        --containerd-worker-namespace=k8s.io
      Restart=always

      [Install]
      WantedBy=multi-user.target
  register: nerdctl_buildkit_unit

- name: buildkitd 활성화 및 기동
  ansible.builtin.systemd:
    name: buildkit
    daemon_reload: "{{ nerdctl_buildkit_unit.changed }}"
    enabled: true
    state: started

- name: k3s server kubeconfig 생성 대기
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
  when: k3s_role == 'server'

- name: 노드 조인 토큰 조회
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_raw
  when: k3s_role == 'server'

- name: 노드 조인 토큰 fact 등록 (다른 host의 play에서 hostvars로 참조)
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"
  when: k3s_role == 'server'

- name: kubeconfig 컨트롤 노드로 가져오기
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_kubeconfig_fetch_dir }}/{{ inventory_hostname }}-kubeconfig.yaml"
    flat: true
  when: k3s_role == 'server'

- name: kubeconfig 서버 주소를 노드 접속 주소로 치환
  ansible.builtin.replace:
    path: "{{ k3s_kubeconfig_fetch_dir }}/{{ inventory_hostname }}-kubeconfig.yaml"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host | default(inventory_hostname) }}:6443"
  delegate_to: localhost
  become: false
  when: k3s_role == 'server'
