apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-local-libvirt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gjwnssud/iac-multicloud.git
    targetRevision: main
    path: argocd/apps
    directory:
      include: "*-local-libvirt.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
