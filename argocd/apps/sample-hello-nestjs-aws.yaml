apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-hello-nestjs-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gjwnssud/iac-multicloud.git
    targetRevision: main
    path: apps/sample-hello-nestjs/chart
    helm:
      valueFiles:
        - values.yaml
        - values-aws.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-hello-nestjs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
