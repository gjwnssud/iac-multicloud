# GitHub organization에서 topic "hznlabs-app"이 붙고 deploy/values-gcp.yaml 이 있는 저장소를 자동 발견해
# 이 인프라 저장소의 범용 chart(charts/app)로 배포한다. 앱 저장소가 생기면 이 파일은 수정하지 않는다.
# 전제: argocd 네임스페이스에 Secret github-token(key: token)이 있어야 한다 (docs/adding-an-app.md 0절).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-gcp
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - scmProvider:
        github:
          organization: hznlabs
          tokenRef:
            secretName: github-token
            key: token
        filters:
          - labelMatch: "^hznlabs-app$"
            pathsExist:
              - deploy/values-gcp.yaml
        requeueAfterSeconds: 180
  template:
    metadata:
      name: '{{ .repository }}-gcp'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://github.com/gjwnssud/iac-multicloud.git
          targetRevision: main
          path: charts/app
          helm:
            releaseName: '{{ .repository }}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/deploy/values.yaml
              - $values/deploy/values-gcp.yaml
        - repoURL: '{{ .url }}'
          targetRevision: '{{ .branch }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .repository }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
