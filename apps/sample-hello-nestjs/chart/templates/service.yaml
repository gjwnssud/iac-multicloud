apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample-hello-nestjs.fullname" . }}
  labels:
    {{- include "sample-hello-nestjs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "sample-hello-nestjs.labels" . | nindent 4 }}
