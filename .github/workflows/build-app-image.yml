name: Build App Image (reusable)

# 외부 앱 저장소가 호출하는 재사용 workflow. 앱 저장소의 CI가 이 workflow를 부르면:
#   1) 앱 소스(Dockerfile)를 러너 노드의 k3s containerd로 빌드해 로컬 레지스트리에 push
#   2) 이 인프라 저장소의 apps/<app>/values-<env>.yaml 의 image.repository/tag 를 커밋으로 갱신
#   3) 이후 배포는 ArgoCD가 git을 polling해 처리 (CI는 클러스터에 접근하지 않음)
#
# 전제:
#   - 인프라 저장소에 apps/<app>/values-<env>.yaml 이 먼저 존재해야 한다 (이 파일이 "그 환경에 배포" 선언)
#   - 앱 저장소에 self-hosted runner가 등록돼 있어야 한다
#     (ansible-playbook ... --tags github-runner -e github_runner_repo=<owner>/<app> -e github_runner_build_tools_enabled=true)
#   - 호출 측이 인프라 저장소에 push할 수 있는 토큰(fine-grained PAT, contents:write)을 secret으로 넘긴다
#
# 호출 예시 (앱 저장소의 .github/workflows/deploy.yml) — docs/adding-an-app.md 6절 참고:
#   jobs:
#     build:
#       uses: <owner>/<infra-repo>/.github/workflows/build-app-image.yml@main
#       with: { app: my-app, environment: proxmox, infra_repo: <owner>/<infra-repo> }
#       secrets: { infra_token: ${{ secrets.INFRA_REPO_TOKEN }} }

on:
  workflow_call:
    inputs:
      app:
        description: 앱 이름 (인프라 저장소의 apps/<app>/ 및 이미지 이름과 동일)
        required: true
        type: string
      environment:
        description: 배포 환경 (values-<environment>.yaml)
        required: true
        type: string
      infra_repo:
        description: 인프라 저장소 (owner/repo)
        required: true
        type: string
      infra_ref:
        required: false
        type: string
        default: main
      context:
        description: 앱 저장소 안의 Docker 빌드 컨텍스트 경로
        required: false
        type: string
        default: "."
      runs_on:
        description: 러너 라벨 (JSON 배열 문자열)
        required: false
        type: string
        default: '["self-hosted","proxmox"]'
    secrets:
      infra_token:
        required: true

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # 같은 앱·환경의 빌드가 동시에 인프라 저장소에 push하지 않도록 직렬화
    concurrency:
      group: build-app-image-${{ inputs.infra_repo }}-${{ inputs.app }}-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-src

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo }}
          ref: ${{ inputs.infra_ref }}
          token: ${{ secrets.infra_token }}
          path: infra

      - name: 이미지 빌드/push + values 갱신
        env:
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          CONTEXT: ${{ inputs.context }}
          SHA: ${{ github.sha }}
        run: |
          infra/.github/scripts/build-one.sh "$APP" "app-src/$CONTEXT" \
            "infra/apps/$APP/values-$ENVIRONMENT.yaml" "$SHA"

      - name: image.tag 변경 커밋/push
        working-directory: infra
        env:
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          INFRA_REF: ${{ inputs.infra_ref }}
          SHA: ${{ github.sha }}
        run: |
          git diff --quiet -- apps && { echo "변경 없음"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/$APP/values-$ENVIRONMENT.yaml"
          git commit -m "chore: $APP $ENVIRONMENT 이미지 태그 갱신 (${SHA::7})"
          git pull --rebase origin "$INFRA_REF"
          git push origin "HEAD:$INFRA_REF"
