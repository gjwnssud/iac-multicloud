# 대상 환경은 리포지토리 변수 CI_ENVIRONMENTS(JSON 배열)로 지정한다. 비어 있으면 plan하지 않는다.
# 지원 환경과 러너 라벨은 .github/environments.json에 정의한다 ("plan": true 인 환경만 대상).
# self-hosted runner 환경은 러너가 없으면 job이 대기한다.
name: OpenTofu Plan

on:
  pull_request:
    paths:
      - "opentofu/**"
      - "policy/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.env.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: env
        env:
          CI_ENVIRONMENTS: ${{ vars.CI_ENVIRONMENTS }}
        run: .github/scripts/select-environments.sh plan

  plan:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    # 사설망 환경은 내부 self-hosted runner에서만 실행 가능 (러너 라벨은 environments.json)
    # (계획서 7번 리스크: GitHub 호스팅 러너는 로컬 네트워크에 도달 불가)
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    defaults:
      run:
        working-directory: opentofu/environments/${{ matrix.environment }}
    env:
      TF_VAR_allowed_ssh_cidrs: ${{ vars.ALLOWED_SSH_CIDRS }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_ssh_username: ${{ vars.SSH_USERNAME }}
      TF_VAR_image: ${{ matrix.provider == 'aws' && vars.AWS_AMI_ID || '' }}
      TF_VAR_project: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.5"

      - name: AWS 자격증명 설정
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: GCP 자격증명 설정
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Azure 자격증명 설정
        if: matrix.provider == 'azure'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        run: |
          tofu plan -input=false -out=plan.tfplan
          tofu show -json plan.tfplan > plan.json
          tofu show -no-color plan.tfplan > plan.txt

      - name: Conftest 정책 검증
        run: conftest test --policy ../../../policy plan.json

      - name: PR에 plan 결과 코멘트
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'opentofu/environments/${{ matrix.environment }}/plan.txt';
            const body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(plan 출력 없음 - 이전 단계 실패)';
            const marker = `<!-- tofu-plan:${{ matrix.environment }} -->`;
            const commentBody = `${marker}\n### OpenTofu Plan: \`${{ matrix.environment }}\`\n\n\`\`\`\n${body.slice(0, 60000)}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
